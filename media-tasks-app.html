<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة العمل الإعلامي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0f1117;
    --bg2:       #1a1d27;
    --bg3:       #22263a;
    --border:    rgba(255,255,255,0.07);
    --border2:   rgba(255,255,255,0.13);
    --text:      #e8eaf0;
    --text2:     #8b90a7;
    --text3:     #555a72;
    --accent:    #4f7fff;
    --accent2:   #3a6aff;
    --green:     #22c98a;
    --amber:     #f5a623;
    --red:       #e84545;
    --purple:    #9b6dff;
    --radius:    14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  /* ── LOGIN ── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  .login-card {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 24px;
    padding: 52px 48px;
    text-align: center;
    width: 380px;
  }
  .login-logo {
    width: 64px; height: 64px;
    background: var(--accent);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    margin: 0 auto 24px;
  }
  .login-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .login-card p  { font-size: 14px; color: var(--text2); margin-bottom: 36px; line-height: 1.6; }
  .google-btn {
    width: 100%;
    padding: 14px 24px;
    background: #fff;
    color: #1a1a2e;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-family: 'Cairo', sans-serif;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: opacity 0.2s;
  }
  .google-btn:hover { opacity: 0.9; }
  .google-btn svg { width: 20px; height: 20px; }

  /* ── LAYOUT ── */
  #app { display: none; min-height: 100vh; flex-direction: column; }

  /* ── TOPBAR ── */
  .topbar {
    height: 60px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 14px; }
  .topbar-logo { font-size: 18px; font-weight: 700; color: var(--text); }
  .topbar-logo span { color: var(--accent); }
  .role-badge {
    font-size: 11px; font-weight: 600; padding: 4px 10px;
    border-radius: 20px; letter-spacing: 0.03em;
  }
  .role-manager    { background: rgba(79,127,255,0.15); color: var(--accent); }
  .role-supervisor { background: rgba(155,109,255,0.15); color: var(--purple); }
  .role-employee   { background: rgba(34,201,138,0.15); color: var(--green); }

  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent); display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 13px; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-name { font-size: 13px; font-weight: 500; }
  .logout-btn {
    font-size: 12px; color: var(--text3); cursor: pointer;
    padding: 6px 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: transparent;
    font-family: 'Cairo', sans-serif; transition: all 0.2s;
  }
  .logout-btn:hover { border-color: var(--border2); color: var(--text2); }

  /* ── MAIN ── */
  .main { display: flex; flex: 1; }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    padding: 20px 12px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: var(--radius-sm);
    cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text2); transition: all 0.18s;
    border: 1px solid transparent;
  }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active {
    background: rgba(79,127,255,0.12);
    color: var(--accent);
    border-color: rgba(79,127,255,0.2);
  }
  .nav-icon { font-size: 17px; }
  .nav-divider { height: 1px; background: var(--border); margin: 8px 4px; }

  /* ── CONTENT ── */
  .content { flex: 1; padding: 28px; overflow-y: auto; }

  /* ── PAGE HEADER ── */
  .page-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  .page-title { font-size: 20px; font-weight: 700; }
  .page-subtitle { font-size: 13px; color: var(--text2); margin-top: 3px; }

  /* ── BUTTONS ── */
  .btn {
    padding: 10px 20px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600; font-family: 'Cairo', sans-serif;
    cursor: pointer; border: none; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost {
    background: transparent; color: var(--text2);
    border: 1px solid var(--border2);
  }
  .btn-ghost:hover { background: var(--bg3); color: var(--text); }
  .btn-danger { background: rgba(232,69,69,0.15); color: var(--red); border: 1px solid rgba(232,69,69,0.25); }

  /* ── STATS ── */
  .stats-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px; margin-bottom: 28px;
  }
  .stat-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
  }
  .stat-num { font-size: 32px; font-weight: 700; line-height: 1; margin-bottom: 6px; }
  .stat-lbl { font-size: 12px; color: var(--text2); font-weight: 500; }

  /* ── FILTERS ── */
  .filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-chip {
    padding: 7px 16px; border-radius: 20px;
    border: 1px solid var(--border2); background: transparent;
    color: var(--text2); font-size: 13px; font-family: 'Cairo', sans-serif;
    cursor: pointer; transition: all 0.18s; font-weight: 500;
  }
  .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
  .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── TASKS GRID ── */
  .tasks-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  /* ── TASK CARD ── */
  .task-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    cursor: pointer;
  }
  .task-card:hover { border-color: var(--border2); transform: translateY(-2px); }
  .task-card-accent { height: 3px; }
  .task-card-body { padding: 16px; }
  .task-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .task-title { font-size: 14px; font-weight: 600; line-height: 1.5; flex: 1; }
  .status-badge {
    font-size: 11px; font-weight: 600; padding: 4px 10px;
    border-radius: 20px; white-space: nowrap; flex-shrink: 0;
  }
  .s-new       { background: rgba(79,127,255,0.15); color: var(--accent); }
  .s-progress  { background: rgba(245,166,35,0.15);  color: var(--amber); }
  .s-review    { background: rgba(155,109,255,0.15); color: var(--purple); }
  .s-done      { background: rgba(34,201,138,0.15);  color: var(--green); }
  .s-cancelled { background: rgba(232,69,69,0.15);   color: var(--red); }

  .task-meta {
    display: flex; gap: 14px; margin-top: 12px;
    font-size: 12px; color: var(--text2); flex-wrap: wrap;
  }
  .task-meta span { display: flex; align-items: center; gap: 5px; }
  .task-comments-count {
    margin-top: 10px; font-size: 12px; color: var(--text3);
    display: flex; align-items: center; gap: 5px;
  }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); z-index: 1000;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: 20px; width: 100%; max-width: 580px;
    max-height: 90vh; overflow-y: auto;
    padding: 28px;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
  }
  .modal-title { font-size: 18px; font-weight: 700; }
  .modal-close {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--bg3); border: none; color: var(--text2);
    font-size: 18px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    font-family: 'Cairo', sans-serif; line-height: 1;
  }

  /* ── FORM ── */
  .form-group { margin-bottom: 18px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 8px; display: block; }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 11px 14px;
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: var(--radius-sm); color: var(--text);
    font-size: 14px; font-family: 'Cairo', sans-serif;
    outline: none; transition: border-color 0.2s; direction: rtl;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--accent);
  }
  .form-select option { background: var(--bg2); }
  .form-textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  /* ── TASK DETAIL ── */
  .task-detail-header { margin-bottom: 20px; }
  .task-detail-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; line-height: 1.4; }
  .task-detail-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text2); }
  .task-detail-meta span { display: flex; align-items: center; gap: 6px; }
  .detail-section { margin-bottom: 20px; }
  .detail-section-title {
    font-size: 12px; font-weight: 600; color: var(--text3);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;
  }
  .detail-desc {
    font-size: 14px; color: var(--text2); line-height: 1.7;
    background: var(--bg3); padding: 14px; border-radius: var(--radius-sm);
  }

  /* ── COMMENTS ── */
  .comments-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .comment {
    background: var(--bg3); border-radius: var(--radius-sm);
    padding: 14px; border: 1px solid var(--border);
  }
  .comment-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .comment-author { display: flex; align-items: center; gap: 8px; }
  .comment-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); display: flex; align-items: center;
    justify-content: center; font-size: 11px; font-weight: 700;
    overflow: hidden; flex-shrink: 0;
  }
  .comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .comment-name { font-size: 13px; font-weight: 600; }
  .comment-time { font-size: 11px; color: var(--text3); }
  .comment-text { font-size: 13px; color: var(--text2); line-height: 1.6; }
  .comment-input-row { display: flex; gap: 10px; align-items: flex-end; }
  .comment-input {
    flex: 1; padding: 10px 14px;
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: var(--radius-sm); color: var(--text);
    font-size: 13px; font-family: 'Cairo', sans-serif;
    outline: none; resize: none; min-height: 44px; direction: rtl;
    transition: border-color 0.2s;
  }
  .comment-input:focus { border-color: var(--accent); }

  /* ── STATUS SELECTOR ── */
  .status-selector { display: flex; gap: 8px; flex-wrap: wrap; }
  .status-opt {
    padding: 7px 14px; border-radius: 20px;
    border: 1px solid var(--border2); background: transparent;
    color: var(--text2); font-size: 12px; font-family: 'Cairo', sans-serif;
    cursor: pointer; transition: all 0.18s; font-weight: 500;
  }
  .status-opt.selected { border-width: 2px; }
  .status-opt[data-s="جديدة"].selected       { background: rgba(79,127,255,0.15);  color: var(--accent);  border-color: var(--accent); }
  .status-opt[data-s="قيد التنفيذ"].selected  { background: rgba(245,166,35,0.15); color: var(--amber);   border-color: var(--amber); }
  .status-opt[data-s="في المراجعة"].selected  { background: rgba(155,109,255,0.15);color: var(--purple);  border-color: var(--purple); }
  .status-opt[data-s="تمت"].selected          { background: rgba(34,201,138,0.15); color: var(--green);   border-color: var(--green); }
  .status-opt[data-s="ملغاة"].selected        { background: rgba(232,69,69,0.15);  color: var(--red);     border-color: var(--red); }

  /* ── EMPTY STATE ── */
  .empty { text-align: center; padding: 60px 20px; color: var(--text3); }
  .empty-icon { font-size: 48px; margin-bottom: 14px; }
  .empty p { font-size: 15px; }

  /* ── LOADING ── */
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 60px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: var(--bg3); border: 1px solid var(--border2);
    color: var(--text); padding: 12px 24px; border-radius: 30px;
    font-size: 14px; font-weight: 500; z-index: 9999;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* ── USERS PAGE ── */
  .users-list { display: flex; flex-direction: column; gap: 10px; }
  .user-row {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .user-row-left { display: flex; align-items: center; gap: 12px; }
  .user-row-name { font-size: 14px; font-weight: 600; }
  .user-row-email { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .user-row-right { display: flex; align-items: center; gap: 10px; }
  .role-select {
    padding: 6px 12px; background: var(--bg3);
    border: 1px solid var(--border2); border-radius: var(--radius-sm);
    color: var(--text); font-size: 13px; font-family: 'Cairo', sans-serif;
    outline: none; cursor: pointer;
  }

  /* ── HIDDEN ── */
  .page { display: none; }
  .page.active { display: block; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">📡</div>
    <h1>منصة العمل الإعلامي</h1>
    <p>سجّل دخولك بحساب Google الخاص بالجمعية لمتابعة المهام الإعلامية</p>
    <button class="google-btn" onclick="signInWithGoogle()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      تسجيل الدخول بـ Google
    </button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">📡 <span>إعلام</span></div>
      <span class="role-badge" id="role-badge">—</span>
    </div>
    <div class="topbar-right">
      <div class="user-info">
        <div class="avatar" id="top-avatar">—</div>
        <span class="user-name" id="top-name">—</span>
      </div>
      <button class="logout-btn" onclick="signOut()">خروج</button>
    </div>
  </div>

  <div class="main">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="nav-item active" data-page="tasks" onclick="switchPage('tasks')">
        <span class="nav-icon">📋</span> المهام
      </div>
      <div class="nav-item" data-page="add-task" onclick="switchPage('add-task')" id="nav-add" style="display:none">
        <span class="nav-icon">➕</span> إضافة مهمة
      </div>
      <div class="nav-divider"></div>
      <div class="nav-item" data-page="users" onclick="switchPage('users')" id="nav-users" style="display:none">
        <span class="nav-icon">👥</span> الفريق
      </div>
    </div>

    <!-- Content -->
    <div class="content">

      <!-- TASKS PAGE -->
      <div class="page active" id="page-tasks">
        <div class="page-header">
          <div>
            <div class="page-title">المهام</div>
            <div class="page-subtitle" id="tasks-subtitle">جاري التحميل...</div>
          </div>
        </div>
        <div class="stats-grid" id="stats-grid"></div>
        <div class="filters" id="filter-bar"></div>
        <div id="tasks-container"><div class="spinner"></div></div>
      </div>

      <!-- ADD TASK PAGE -->
      <div class="page" id="page-add-task">
        <div class="page-header">
          <div>
            <div class="page-title">إضافة مهمة جديدة</div>
            <div class="page-subtitle">أضف مهمة ووزّعها على أحد أعضاء الفريق</div>
          </div>
        </div>
        <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:600px">
          <div class="form-group">
            <label class="form-label">عنوان المهمة *</label>
            <input type="text" class="form-input" id="f-title" placeholder="مثال: تصميم بوستر لرمضان">
          </div>
          <div class="form-group">
            <label class="form-label">الوصف والتفاصيل</label>
            <textarea class="form-textarea" id="f-desc" placeholder="اكتب تفاصيل المهمة هنا..."></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">النوع</label>
              <select class="form-select" id="f-type">
                <option value="تصميم">تصميم</option>
                <option value="فيديو">فيديو</option>
                <option value="تصوير">تصوير</option>
                <option value="كتابة">كتابة</option>
                <option value="أخرى">أخرى</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">الأولوية</label>
              <select class="form-select" id="f-priority">
                <option value="عادية">عادية</option>
                <option value="متوسطة">متوسطة</option>
                <option value="عاجلة">عاجلة</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">تعيين إلى *</label>
              <select class="form-select" id="f-assignee"></select>
            </div>
            <div class="form-group">
              <label class="form-label">تاريخ التسليم</label>
              <input type="date" class="form-input" id="f-due">
            </div>
          </div>
          <div style="display:flex;gap:12px;margin-top:8px">
            <button class="btn btn-primary" onclick="addTask()">➕ إضافة المهمة</button>
            <button class="btn btn-ghost" onclick="switchPage('tasks')">إلغاء</button>
          </div>
        </div>
      </div>

      <!-- USERS PAGE -->
      <div class="page" id="page-users">
        <div class="page-header">
          <div>
            <div class="page-title">إدارة الفريق</div>
            <div class="page-subtitle">عدّل أدوار أعضاء الفريق</div>
          </div>
        </div>
        <div class="users-list" id="users-list"><div class="spinner"></div></div>
      </div>

    </div>
  </div>
</div>

<!-- TASK DETAIL MODAL -->
<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">تفاصيل المهمة</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut as fbSignOut }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, onSnapshot,
  query, where, orderBy, serverTimestamp, setDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ══════════════════════════════════════════════
  apiKey: "AIzaSyADZ5AV9y4qia5tOB-sQKp9S3XHpsB2hrM",
  authDomain: "media-tasks.firebaseapp.com",
  databaseURL: "https://media-tasks-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "media-tasks",
  storageBucket: "media-tasks.firebasestorage.app",
  messagingSenderId: "907187740078",
  appId: "1:907187740078:web:553c6c7c44c805d60fbc3f",
  measurementId: "G-BKPE6Q2P30"
// ══════════════════════════════════════════════
apiKey: "AIzaSyADZ5AV9y4qia5tOB-sQKp9S3XHpsB2hrM",
  authDomain: "media-tasks.firebaseapp.com",
  databaseURL: "https://media-tasks-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "media-tasks",
  storageBucket: "media-tasks.firebasestorage.app",
  messagingSenderId: "907187740078",
  appId: "1:907187740078:web:553c6c7c44c805d60fbc3f",
  measurementId: "G-BKPE6Q2P30"
};
// ══════════════════════════════════════════════

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

let currentUser = null;
let currentRole = "employee";
let allUsers    = [];
let activeFilter = "الكل";
let currentTaskId = null;
let tasksUnsub = null;

// ─── AUTH ───
window.signInWithGoogle = async () => {
  const provider = new GoogleAuthProvider();
  try { await signInWithPopup(auth, provider); }
  catch(e) { toast("حدث خطأ في تسجيل الدخول"); }
};

window.signOut = async () => {
  if (tasksUnsub) tasksUnsub();
  await fbSignOut(auth);
};

onAuthStateChanged(auth, async user => {
  if (user) {
    currentUser = user;
    // حفظ/تحديث بيانات المستخدم
    const uRef = doc(db, "users", user.uid);
    const uSnap = await getDoc(uRef);
    if (!uSnap.exists()) {
      await setDoc(uRef, {
        name:  user.displayName,
        email: user.email,
        photo: user.photoURL || "",
        role:  "employee",
        createdAt: serverTimestamp()
      });
    }
    const userData = (await getDoc(uRef)).data();
    currentRole = userData.role || "employee";
    showApp();
  } else {
    currentUser = null;
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }
});

function showApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "flex";

  // Topbar
  const av = document.getElementById("top-avatar");
  if (currentUser.photoURL) {
    av.innerHTML = `<img src="${currentUser.photoURL}" alt="">`;
  } else {
    av.textContent = (currentUser.displayName||"?")[0];
  }
  document.getElementById("top-name").textContent = currentUser.displayName || currentUser.email;

  // Role badge
  const rb = document.getElementById("role-badge");
  const roleMap = { manager: "مدير", supervisor: "مشرف", employee: "موظف" };
  const roleClass = { manager: "role-manager", supervisor: "role-supervisor", employee: "role-employee" };
  rb.textContent = roleMap[currentRole] || "موظف";
  rb.className = "role-badge " + (roleClass[currentRole] || "role-employee");

  // Show nav items based on role
  if (currentRole === "manager" || currentRole === "supervisor") {
    document.getElementById("nav-add").style.display = "flex";
  }
  if (currentRole === "manager") {
    document.getElementById("nav-users").style.display = "flex";
  }

  loadUsers();
  switchPage("tasks");
}

// ─── PAGES ───
window.switchPage = (page) => {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  document.getElementById("page-" + page).classList.add("active");
  document.querySelector(`[data-page="${page}"]`)?.classList.add("active");

  if (page === "tasks") loadTasks();
  if (page === "users") loadUsersPage();
  if (page === "add-task") populateAssigneeDropdown();
};

// ─── LOAD USERS ───
async function loadUsers() {
  const snap = await getDocs(collection(db, "users"));
  allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function loadUsersPage() {
  const list = document.getElementById("users-list");
  list.innerHTML = '<div class="spinner"></div>';
  await loadUsers();
  if (allUsers.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">👥</div><p>لا يوجد مستخدمون بعد</p></div>';
    return;
  }
  const roleMap   = { manager: "مدير", supervisor: "مشرف", employee: "موظف" };
  const roleClass = { manager: "role-manager", supervisor: "role-supervisor", employee: "role-employee" };
  list.innerHTML = allUsers.map(u => `
    <div class="user-row">
      <div class="user-row-left">
        <div class="avatar" style="width:40px;height:40px;font-size:15px">
          ${u.photo ? `<img src="${u.photo}" alt="">` : (u.name||"?")[0]}
        </div>
        <div>
          <div class="user-row-name">${u.name || "—"}</div>
          <div class="user-row-email">${u.email || ""}</div>
        </div>
      </div>
      <div class="user-row-right">
        <span class="role-badge ${roleClass[u.role]||'role-employee'}">${roleMap[u.role]||'موظف'}</span>
        ${currentRole === "manager" ? `
        <select class="role-select" onchange="changeRole('${u.id}', this.value)">
          <option value="employee"   ${u.role==='employee'   ?'selected':''}>موظف</option>
          <option value="supervisor" ${u.role==='supervisor' ?'selected':''}>مشرف</option>
          <option value="manager"    ${u.role==='manager'    ?'selected':''}>مدير</option>
        </select>` : ""}
      </div>
    </div>
  `).join("");
}

window.changeRole = async (uid, role) => {
  await updateDoc(doc(db, "users", uid), { role });
  toast("تم تحديث الدور");
  await loadUsers();
};

// ─── TASKS ───
function loadTasks() {
  if (tasksUnsub) tasksUnsub();
  const container = document.getElementById("tasks-container");
  container.innerHTML = '<div class="spinner"></div>';

  let q;
  if (currentRole === "manager") {
    q = query(collection(db, "tasks"), orderBy("createdAt", "desc"));
  } else if (currentRole === "supervisor") {
    q = query(collection(db, "tasks"), orderBy("createdAt", "desc"));
  } else {
    q = query(collection(db, "tasks"),
      where("assigneeId", "==", currentUser.uid),
      orderBy("createdAt", "desc"));
  }

  tasksUnsub = onSnapshot(q, snap => {
    let tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTasks(tasks);
  });
}

function renderTasks(tasks) {
  // Stats
  const statuses = ["جديدة","قيد التنفيذ","في المراجعة","تمت","ملغاة"];
  const counts = {};
  statuses.forEach(s => counts[s] = tasks.filter(t => t.status === s).length);

  document.getElementById("tasks-subtitle").textContent =
    `${tasks.length} مهمة إجمالاً`;

  document.getElementById("stats-grid").innerHTML = `
    <div class="stat-card"><div class="stat-num" style="color:var(--text)">${tasks.length}</div><div class="stat-lbl">إجمالي المهام</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--accent)">${counts["جديدة"]||0}</div><div class="stat-lbl">جديدة</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--amber)">${counts["قيد التنفيذ"]||0}</div><div class="stat-lbl">قيد التنفيذ</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--green)">${counts["تمت"]||0}</div><div class="stat-lbl">تمت</div></div>
  `;

  // Filter chips
  const allFilters = ["الكل", ...statuses];
  document.getElementById("filter-bar").innerHTML = allFilters.map(f => `
    <button class="filter-chip ${activeFilter===f?'active':''}" onclick="setFilter('${f}')">${f}</button>
  `).join("");

  // Filter tasks
  const filtered = activeFilter === "الكل" ? tasks : tasks.filter(t => t.status === activeFilter);

  const container = document.getElementById("tasks-container");
  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><p>لا توجد مهام في هذا التصنيف</p></div>';
    return;
  }

  const statusClass = { "جديدة":"s-new","قيد التنفيذ":"s-progress","في المراجعة":"s-review","تمت":"s-done","ملغاة":"s-cancelled" };
  const accentColor = { "جديدة":"var(--accent)","قيد التنفيذ":"var(--amber)","في المراجعة":"var(--purple)","تمت":"var(--green)","ملغاة":"var(--red)" };

  container.innerHTML = `<div class="tasks-grid">${filtered.map(t => `
    <div class="task-card" onclick="openTask('${t.id}')">
      <div class="task-card-accent" style="background:${accentColor[t.status]||'var(--border2)'}"></div>
      <div class="task-card-body">
        <div class="task-card-top">
          <div class="task-title">${t.title}</div>
          <span class="status-badge ${statusClass[t.status]||'s-new'}">${t.status||'جديدة'}</span>
        </div>
        ${t.description ? `<div style="font-size:13px;color:var(--text2);margin-bottom:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${t.description}</div>` : ""}
        <div class="task-meta">
          <span>📁 ${t.type||'—'}</span>
          <span>👤 ${t.assigneeName||'—'}</span>
          ${t.dueDate ? `<span>📅 ${t.dueDate}</span>` : ""}
          ${t.priority === "عاجلة" ? `<span style="color:var(--red)">🔴 عاجلة</span>` : ""}
        </div>
        <div class="task-comments-count">💬 ${t.commentsCount||0} تعليق</div>
      </div>
    </div>
  `).join("")}</div>`;
}

window.setFilter = (f) => {
  activeFilter = f;
  loadTasks();
};

// ─── ADD TASK ───
async function populateAssigneeDropdown() {
  await loadUsers();
  const sel = document.getElementById("f-assignee");
  sel.innerHTML = allUsers.map(u =>
    `<option value="${u.id}|${u.name}">${u.name}</option>`
  ).join("");
}

window.addTask = async () => {
  const title = document.getElementById("f-title").value.trim();
  const assigneeRaw = document.getElementById("f-assignee").value;
  if (!title) { toast("يرجى كتابة عنوان المهمة"); return; }
  if (!assigneeRaw) { toast("يرجى تحديد المسؤول عن المهمة"); return; }

  const [assigneeId, assigneeName] = assigneeRaw.split("|");

  await addDoc(collection(db, "tasks"), {
    title,
    description: document.getElementById("f-desc").value.trim(),
    type:        document.getElementById("f-type").value,
    priority:    document.getElementById("f-priority").value,
    assigneeId,
    assigneeName,
    status:      "جديدة",
    createdBy:   currentUser.displayName,
    createdById: currentUser.uid,
    dueDate:     document.getElementById("f-due").value || null,
    commentsCount: 0,
    createdAt:   serverTimestamp()
  });

  // إعادة ضبط الفورم
  ["f-title","f-desc","f-due"].forEach(id => document.getElementById(id).value = "");
  toast("✅ تمت إضافة المهمة بنجاح");
  switchPage("tasks");
};

// ─── TASK DETAIL ───
window.openTask = async (taskId) => {
  currentTaskId = taskId;
  const modal = document.getElementById("task-modal");
  const body  = document.getElementById("modal-body");
  body.innerHTML = '<div class="spinner"></div>';
  modal.classList.add("open");

  const tSnap = await getDoc(doc(db, "tasks", taskId));
  if (!tSnap.exists()) { body.innerHTML = "<p>المهمة غير موجودة</p>"; return; }
  const t = { id: tSnap.id, ...tSnap.data() };

  // Comments
  const cSnap = await getDocs(
    query(collection(db, "tasks", taskId, "comments"), orderBy("createdAt", "asc"))
  );
  const comments = cSnap.docs.map(d => ({ id: d.id, ...d.data() }));

  const statusClass = { "جديدة":"s-new","قيد التنفيذ":"s-progress","في المراجعة":"s-review","تمت":"s-done","ملغاة":"s-cancelled" };
  const statuses = ["جديدة","قيد التنفيذ","في المراجعة","تمت","ملغاة"];

  const canChangeStatus = currentRole === "manager" || currentRole === "supervisor"
    || t.assigneeId === currentUser.uid;

  body.innerHTML = `
    <div class="task-detail-header">
      <div class="task-detail-title">${t.title}</div>
      <div class="task-detail-meta">
        <span>📁 ${t.type||'—'}</span>
        <span>👤 ${t.assigneeName||'—'}</span>
        ${t.dueDate ? `<span>📅 ${t.dueDate}</span>` : ""}
        <span class="status-badge ${statusClass[t.status]||'s-new'}">${t.status||'جديدة'}</span>
      </div>
    </div>

    ${t.description ? `
    <div class="detail-section">
      <div class="detail-section-title">الوصف</div>
      <div class="detail-desc">${t.description}</div>
    </div>` : ""}

    ${canChangeStatus ? `
    <div class="detail-section">
      <div class="detail-section-title">تغيير الحالة</div>
      <div class="status-selector">
        ${statuses.map(s => `
          <button class="status-opt ${t.status===s?'selected':''}" data-s="${s}"
            onclick="changeStatus('${taskId}','${s}',this)">${s}</button>
        `).join("")}
      </div>
    </div>` : ""}

    <div class="detail-section">
      <div class="detail-section-title">التعليقات (${comments.length})</div>
      <div class="comments-list" id="comments-list">
        ${comments.length === 0 ? '<p style="color:var(--text3);font-size:13px">لا يوجد تعليقات بعد — كن أول من يعلّق</p>' :
          comments.map(c => commentHTML(c)).join("")}
      </div>
      <div class="comment-input-row">
        <textarea class="comment-input" id="comment-text" placeholder="اكتب تعليقاً..." rows="2"></textarea>
        <button class="btn btn-primary" onclick="addComment('${taskId}')">إرسال</button>
      </div>
    </div>
  `;
};

function commentHTML(c) {
  const time = c.createdAt?.toDate ? c.createdAt.toDate().toLocaleString("ar-SA") : "";
  return `
    <div class="comment">
      <div class="comment-header">
        <div class="comment-author">
          <div class="comment-avatar">
            ${c.authorPhoto ? `<img src="${c.authorPhoto}" alt="">` : (c.authorName||"?")[0]}
          </div>
          <span class="comment-name">${c.authorName||"—"}</span>
        </div>
        <span class="comment-time">${time}</span>
      </div>
      <div class="comment-text">${c.text}</div>
    </div>
  `;
}

window.addComment = async (taskId) => {
  const text = document.getElementById("comment-text").value.trim();
  if (!text) return;

  await addDoc(collection(db, "tasks", taskId, "comments"), {
    text,
    authorName:  currentUser.displayName || currentUser.email,
    authorPhoto: currentUser.photoURL || "",
    authorId:    currentUser.uid,
    createdAt:   serverTimestamp()
  });

  // تحديث عداد التعليقات
  const tRef = doc(db, "tasks", taskId);
  const tSnap = await getDoc(tRef);
  await updateDoc(tRef, { commentsCount: (tSnap.data().commentsCount||0) + 1 });

  document.getElementById("comment-text").value = "";
  // إعادة تحميل التعليقات
  const cSnap = await getDocs(
    query(collection(db, "tasks", taskId, "comments"), orderBy("createdAt", "asc"))
  );
  const comments = cSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  const list = document.getElementById("comments-list");
  if (list) list.innerHTML = comments.map(c => commentHTML(c)).join("");
  toast("💬 تم إرسال التعليق");
};

window.changeStatus = async (taskId, status, btn) => {
  await updateDoc(doc(db, "tasks", taskId), { status });
  document.querySelectorAll(".status-opt").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
  toast("✅ تم تحديث الحالة");
};

window.closeModal = () => {
  document.getElementById("task-modal").classList.remove("open");
  currentTaskId = null;
};

// إغلاق المودال عند الضغط خارجه
document.getElementById("task-modal").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeModal();
});

// ─── TOAST ───
window.toast = (msg) => {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 3000);
};
</script>
</body>
</html>
